# cargo test を push / PR ごとに実行する最小 CI
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # workspace 全体（akapen / semantic-reading / vendored tui-markdown）を走らせる。
      # 無印だとルートパッケージのテストしか実行されない。
      - run: cargo test --locked --workspace

  # vendored tui-markdown fork が上流から想定内の差分しか持っていないことを検証
  # （誤った再ベンダリング / 意図しないフォーク変更を検知）。
  # 上流ソースは registry キャッシュにないので static.crates.io から取得する。
  vendor-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-vendor-diff.sh
