[package]
name = "akapen"
version = "0.1.0"
edition = "2024"
description = "Markdown line-comment TUI for agent workflows: read rendered markdown, mark up lines like a red pen, send comments to your agent."
license = "MIT"
repository = "https://github.com/worldnine/akapen"
keywords = ["tui", "markdown", "code-review", "agent", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
flate2 = "1"
libc = "0.2"
ratatui = "0.30"
semantic-reading = { path = "crates/semantic-reading" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tachyonfx = { version = "0.25", features = ["std-duration"] }
akapen-tui-markdown = { version = "0.4.0", path = "third_party/tui-markdown" }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
similar = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/semantic-reading", "third_party/tui-markdown"]

[profile.release]
strip = true
lto = "thin"
